<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b202c"/>
      <stop offset="50%" stop-color="#10131a"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#0984e3"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>

    <!-- Screen Glow & Frame -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c12"/>
      <stop offset="100%" stop-color="#020407"/>
    </linearGradient>

    <!-- D-Pad Metallic Gradient -->
    <linearGradient id="dpadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3340"/>
      <stop offset="100%" stop-color="#161a22"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Console Body -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#chassisGrad)" stroke="url(#neonRim)" stroke-width="8" filter="url(#softShadow)"/>

  <!-- Screen Outer Frame -->
  <rect x="76" y="80" width="360" height="210" rx="28" fill="#0c0e14" stroke="#252b38" stroke-width="6"/>

  <!-- Inner CRT Display -->
  <rect x="90" y="94" width="332" height="182" rx="18" fill="url(#screenGrad)"/>

  <!-- CRT Scanlines Pattern -->
  <g opacity="0.12">
    <line x1="90" y1="110" x2="422" y2="110" stroke="#00ffcc" stroke-width="2"/>
    <line x1="90" y1="130" x2="422" y2="130" stroke="#00ffcc" stroke-width="2"/>
    <line x1="90" y1="150" x2="422" y2="150" stroke="#00ffcc" stroke-width="2"/>
    <line x1="90" y1="170" x2="422" y2="170" stroke="#00ffcc" stroke-width="2"/>
    <line x1="90" y1="190" x2="422" y2="190" stroke="#00ffcc" stroke-width="2"/>
    <line x1="90" y1="210" x2="422" y2="210" stroke="#00ffcc" stroke-width="2"/>
    <line x1="90" y1="230" x2="422" y2="230" stroke="#00ffcc" stroke-width="2"/>
    <line x1="90" y1="250" x2="422" y2="250" stroke="#00ffcc" stroke-width="2"/>
  </g>

  <!-- Screen Content: Retro TrayPlay Logo / Graphic -->
  <!-- Neon Ping Pong Paddles and Ball -->
  <rect x="114" y="145" width="10" height="60" rx="4" fill="#00ffcc" filter="url(#neonGlow)"/>
  <rect x="388" y="170" width="10" height="60" rx="4" fill="#00ffcc" filter="url(#neonGlow)"/>
  <circle cx="256" cy="175" r="8" fill="#ff4757" filter="url(#neonGlow)"/>
  <!-- Center Net Dashed Line -->
  <line x1="256" y1="104" x2="256" y2="266" stroke="#1e2736" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Brand Typography on Chassis -->
  <text x="256" y="322" font-family="monospace, sans-serif" font-weight="900" font-size="20" fill="#747d8c" letter-spacing="8" text-anchor="middle">TRAYPLAY</text>

  <!-- Directional Pad (D-Pad) -->
  <g transform="translate(130, 360)">
    <!-- Base Cross -->
    <rect x="-16" y="-50" width="32" height="100" rx="8" fill="url(#dpadGrad)" stroke="#1a202c" stroke-width="3"/>
    <rect x="-50" y="-16" width="100" height="32" rx="8" fill="url(#dpadGrad)" stroke="#1a202c" stroke-width="3"/>
    <!-- Center Pivot Indicator -->
    <circle cx="0" cy="0" r="8" fill="#10131a"/>
    <!-- Directional Arrows/Dots -->
    <circle cx="0" cy="-32" r="3" fill="#00ffcc" opacity="0.8"/>
    <circle cx="0" cy="32" r="3" fill="#00ffcc" opacity="0.8"/>
    <circle cx="-32" cy="0" r="3" fill="#00ffcc" opacity="0.8"/>
    <circle cx="32" cy="0" r="3" fill="#00ffcc" opacity="0.8"/>
  </g>

  <!-- Action Buttons (A / B) -->
  <g transform="translate(370, 410)">
    <!-- Button B (Red Neon) -->
    <circle cx="-42" cy="0" r="22" fill="#2d151c" stroke="#ff4757" stroke-width="4" filter="url(#neonGlow)"/>
    <circle cx="-42" cy="0" r="14" fill="#ff4757"/>
    <text x="-42" y="26" font-family="sans-serif" font-weight="bold" font-size="12" fill="#a4b0be" text-anchor="middle">B</text>

    <!-- Button A (Cyan/Yellow Neon) -->
    <circle cx="12" cy="-36" r="22" fill="#1b2a26" stroke="#00ffcc" stroke-width="4" filter="url(#neonGlow)"/>
    <circle cx="12" cy="-36" r="14" fill="#00ffcc"/>
    <text x="12" y="-10" font-family="sans-serif" font-weight="bold" font-size="12" fill="#a4b0be" text-anchor="middle">A</text>
  </g>

  <!-- Small System Buttons (SELECT / START) -->
  <g transform="translate(256, 435)">
    <rect x="-46" y="-6" width="36" height="12" rx="6" fill="#1e2430" stroke="#2c3545" stroke-width="2"/>
    <rect x="10" y="-6" width="36" height="12" rx="6" fill="#1e2430" stroke="#2c3545" stroke-width="2"/>
  </g>
</svg>
